<!DOCTYPE html>
<html>

<head>
  <title>Loggd</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lexend">
</head>

<body id="body" class="dark">
  <div class="popup-container">
    <div class="logo-container">
      <img src="images/Loggd_Wordmark_Black.png" alt="Loggd" id="lightLogo" class="hiddenLogo">
      <img src="images/Loggd_Wordmark_White.png" alt="Loggd" id="defaultLogo" class="visibleLogo">
    </div>

    <img src="images/themeColors.png" alt="Change color" id="themeImage" class="themeImage">

    <div class="icons">
      <div class="icon-wrapper" data-source="letterboxd" role="button" tabindex="0" title="Letterboxd">
        <div class="icon-img" style="background-image: url('images/letterboxdLogo.png')"></div>
      </div>
      <div class="icon-wrapper" data-source="imdb" role="button" tabindex="0" title="IMDb">
        <div class="icon-img" style="background-image: url('images/imdbLogo.png')"></div>
      </div>
      <div class="icon-wrapper" data-source="tmdb" role="button" tabindex="0" title="TMDB">
        <div class="icon-img" style="background-image: url('images/tmdbLogo.png')"></div>
      </div>
      <div class="icon-wrapper" data-source="rottenTomatoes" role="button" tabindex="0" title="Rotten Tomatoes">
        <div class="icon-img" style="background-image: url('images/rtLogo.png')"></div>
      </div>
      <div class="icon-wrapper" data-source="metacritic" role="button" tabindex="0" title="Metacritic">
        <div class="icon-img" style="background-image: url('images/metacriticLogo.png')"></div>
      </div>
    </div>

    <div class="source-text" id="prompt">Choose a site, then pick a movie</div>
    <p id="detectedNote" class="detected-note muted" role="status" hidden></p>

    <form id="searchForm" class="search-block" autocomplete="off">
      <div class="search-container">
        <input type="text" class="movie-title" id="movieTitle" placeholder="Search for a movie..."
          autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list"
          aria-expanded="false" aria-controls="suggestions">
        <button type="submit" class="search-icon" aria-label="Search"></button>
      </div>
    </form>

    <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>

    <div id="selection" class="selection" hidden>
      <img id="selectionPoster" class="poster" alt="">
      <div class="selection-copy">
        <div id="selectionTitle"></div>
        <div id="selectionYear" class="muted"></div>
      </div>
      <button type="button" id="clearSelection" class="text-button">Change</button>
    </div>

    <section id="watch" class="watch" hidden>
      <div class="watch-bar">
        <span>Where to watch</span>
        <label class="region-label">
          <span class="visually-hidden">Country</span>
          <select id="region"></select>
        </label>
      </div>
      <div id="providers" class="providers"></div>
      <button type="button" id="watchLink" class="text-button" hidden>All options</button>
    </section>

    <p id="setupNote" class="setup-note" hidden>Add your TMDB API key in keys.js, then reload.</p>
    <p id="errorMessage"></p>

    <p class="attribution">
      <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">
        <img src="images/tmdbLogo.png" alt="TMDB">
      </a>
      This product uses the TMDB API but is not endorsed or certified by TMDB.
      Streaming data from <a href="https://www.justwatch.com/" target="_blank" rel="noopener">JustWatch</a>.
    </p>
  </div>
  <footer>Created by Luke McMeans (2024)</footer>
  <script type="module" src="popup.js"></script>
</body>

</html>
